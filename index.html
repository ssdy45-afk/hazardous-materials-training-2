function fd(btn,day){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('on',b===btn));
  ROUTES.forEach(r=>{
    const show=day==='all'||r.d.toString()===day;
    routeLayers[r.d].pl.setStyle({opacity:show?.85:.04,dashArray:show?'11,7':'4,8'});
    routeLayers[r.d].glow.setStyle({opacity:show?.1:.01});
  });
  SPOTS.forEach(s=>{
    const show=day==='all'||s.d.toString()===day;
    const m=markerObjs[s.id];
    if(show){if(!map.hasLayer(m))m.addTo(map);}
    else{if(map.hasLayer(m))map.removeLayer(m);m.closePopup();}
  });
  if(day!=='all'){
    const ds=SPOTS.filter(s=>s.d.toString()===day);
    if(ds.length){const g=L.featureGroup(ds.map(s=>markerObjs[s.id]));map.fitBounds(g.getBounds().pad(0.25),{animate:true});}
    document.getElementById('PE').style.display='flex';
    document.getElementById('IB').style.display='none';
  } else {
    map.setView([26.45,127.82],10,{animate:true});
    document.getElementById('PE').style.display='flex';
    document.getElementById('IB').style.display='none';
  }
}
